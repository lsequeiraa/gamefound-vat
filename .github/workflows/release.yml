name: Release

# Pushing a tag vX.Y.Z (matching package.json) builds, tests, creates the GitHub
# Release and submits the version to addons.mozilla.org and the Chrome Web Store.
# A store is skipped, with a notice, while its secrets are not set.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # checkout stores the tag as a lightweight tag; fetch it again for its message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Tag matches package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run package

      - name: Rebuild from the source zip, as Mozilla's reviewers will
        env:
          SOURCE: gamefound-vat-${{ steps.version.outputs.version }}-source
        run: |
          dir=$(mktemp -d)
          unzip -q "artifacts/$SOURCE.zip" -d "$dir"
          cd "$dir/$SOURCE"
          bun install --frozen-lockfile
          bun run build
          diff -r dist "$GITHUB_WORKSPACE/dist"

      - name: Release notes from the tag message
        run: |
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          cat release-notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--notes-file release-notes.md)
          [ -s release-notes.md ] || notes=(--generate-notes)
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip --title "$GITHUB_REF_NAME" "${notes[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            artifacts/
            dist/
            release-notes.md
          if-no-files-found: error

  firefox:
    needs: build
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - if: env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == ''
        run: echo "::notice::AMO_API_KEY / AMO_API_SECRET not set; skipping addons.mozilla.org."
      - if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Submit to addons.mozilla.org
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          bun install --frozen-lockfile
          RELEASE_NOTES="$(cat release-notes.md)" bun run scripts/amo-metadata.ts amo-metadata.json
          bunx web-ext sign --channel listed \
            --source-dir dist/firefox \
            --upload-source-code "artifacts/gamefound-vat-$VERSION-source.zip" \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --artifacts-dir web-ext-signed

  chrome:
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - if: env.CWS_SERVICE_ACCOUNT_JSON == '' || env.CWS_PUBLISHER_ID == '' || env.CWS_ITEM_ID == ''
        run: echo "::notice::CWS_SERVICE_ACCOUNT_JSON / CWS_PUBLISHER_ID / CWS_ITEM_ID not all set; skipping the Chrome Web Store."
      - if: env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != '' && env.CWS_ITEM_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != '' && env.CWS_ITEM_ID != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - if: env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != '' && env.CWS_ITEM_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Submit to the Chrome Web Store
        if: env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != '' && env.CWS_ITEM_ID != ''
        run: bun run scripts/cws-publish.ts "artifacts/gamefound-vat-$VERSION-chrome.zip"
