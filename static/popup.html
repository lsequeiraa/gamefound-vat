<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gamefound VAT</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 12px 14px; width: 260px; font: 13px/1.4 system-ui, sans-serif; }
      label { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; }
      input { margin: 0; width: 16px; height: 16px; accent-color: #1a9e5c; }
      p { margin: 8px 0 0; opacity: .75; }
    </style>
  </head>
  <body>
    <label><input id="enabled" type="checkbox" /> Show prices incl. VAT</label>
    <p>Reward and add-on prices on Gamefound include the VAT for your delivery country. “≈” marks an estimated rate.</p>
    <script src="popup.js"></script>
  </body>
</html>
